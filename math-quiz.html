

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>افهمها | رياضيات الصف العاشر</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eef3ff;color:#172554;margin:0;padding:16px;line-height:1.8}
main{max-width:800px;margin:auto;background:white;padding:22px;border-radius:18px}
h1{text-align:center;color:#2457c5}
.sub{text-align:center;color:#475569}
.question{background:#f8fafc;border:1px solid #dbeafe;padding:15px;margin:16px 0;border-radius:12px}
.unit{color:#2457c5;font-size:13px;font-weight:bold}
label{display:block;padding:7px;cursor:pointer}
button{background:#2457c5;color:white;border:0;border-radius:9px;padding:12px 20px;font-size:16px;cursor:pointer}
.feedback{padding:10px;border-radius:8px;background:#e8f7ed;margin-top:10px}
#result{font-size:20px;font-weight:bold;margin:18px 0}
</style>
</head>
<body>
<main>
<h1>📘 اختبار افهمها</h1>
<p class="sub">رياضيات الصف العاشر — الفصل الدراسي الأول</p>
<p>اختر إجابة واحدة لكل سؤال، ثم اضغط «تصحيح الاختبار». هذه أسئلة تدريبية أصلية على موضوعات الوحدات، وليست أسئلة امتحان رسمي.</p>
<form id="quiz">
<div id="questions"></div>
<button type="submit">تصحيح الاختبار</button>
<button type="button" onclick="location.reload()">إعادة الاختبار</button>
</form>
<div id="result" aria-live="polite"></div>
</main>
<script>
const questions=[
{
unit:"الوحدة الأولى: استخدام التمثيلات البيانية",
q:"انتقلت النقطة (2، 3) أربع وحدات إلى اليمين ووحدة واحدة إلى الأسفل. ما إحداثياتها الجديدة؟",
o:["(6، 4)","(6، 2)","(-2، 2)","(2، 7)"],
a:1,
e:"الانتقال يمينًا يزيد الإحداثي السيني: 2 + 4 = 6، والانتقال إلى الأسفل ينقص الصادي: 3 - 1 = 2."
},
{
unit:"الوحدة الأولى: تمثيل المناطق في المستوى الإحداثي",
q:"عند تمثيل المتباينة ص > 2س + 1 بيانيًا، كيف يكون خط الحدود؟",
o:["متقطع؛ لأن المتباينة لا تتضمن المساواة","متصل؛ لأن المتباينة تتضمن المساواة","دائرة كاملة","لا نرسم خط حدود"],
a:0,
e:"علامة > لا تتضمن المساواة، لذلك يكون خط الحدود متقطعًا."
},
{
unit:"الوحدة الأولى: الميل",
q:"يمر مستقيم بالنقطتين (1، 2) و(3، 6). ما ميله؟",
o:["1","2","3","4"],
a:1,
e:"الميل = التغير في الصادي ÷ التغير في السيني = (6 - 2) ÷ (3 - 1) = 2."
},
{
unit:"الوحدة الثانية: جمع البيانات وتمثيلها",
q:"يريد باحث تمثيل آراء طلبة الصف العاشر في عدة مدارس. ما الخطوة المناسبة قبل جمع البيانات؟",
o:["اختيار سؤال واضح وتحديد البيانات المطلوبة","كتابة النتائج قبل الاستطلاع","حذف الإجابات المختلفة","اختيار النتائج التي تعجبه فقط"],
a:0,
e:"يبدأ الاستقصاء الإحصائي بتحديد سؤال واضح والبيانات المناسبة وطريقة جمعها."
},
{
unit:"الوحدة الثالثة: المعالجة الجبرية",
q:"بسّط الكسر الجبري (س² - 9) ÷ (س - 3)، حيث س لا تساوي 3.",
o:["س - 3","س + 3","س² + 3","س + 6"],
a:1,
e:"س² - 9 = (س - 3)(س + 3). بعد الاختصار تكون النتيجة س + 3، بشرط س لا تساوي 3."
},
{
unit:"الوحدة الرابعة: الدوائر",
q:"ما قياس الزاوية المحيطية المرسومة على قطر الدائرة؟",
o:["45°","60°","90°","180°"],
a:2,
e:"الزاوية المحيطية التي تقابل قطرًا في الدائرة قائمة، وقياسها 90 درجة."
},
{
unit:"الوحدة الخامسة: المقاييس الإحصائية",
q:"ما الوسيط للبيانات: 3، 4، 6، 8، 9؟",
o:["3","4","6","8"],
a:2,
e:"البيانات مرتبة، والعدد الأوسط هو 6؛ لذلك الوسيط يساوي 6."
},
{
unit:"الوحدة السادسة: التناسب",
q:"تتناسب ص عكسيًا مع س. إذا كانت ص = 4 عندما س = 3، فما قيمة ص عندما س = 6؟",
o:["8","6","4","2"],
a:3,
e:"في التناسب العكسي يكون حاصل الضرب ثابتًا: 4 × 3 = 12، لذلك ص = 12 ÷ 6 = 2."
},
{
unit:"الوحدة السابعة: التمثيلات الإحصائية",
q:"أي تمثيل بياني يناسب عرض بيانات عددية مستمرة مجمعة في فئات؟",
o:["المدرج التكراري","مخطط دائري فقط","جدول أسماء","رسم هندسي للتحويل"],
a:0,
e:"يستخدم المدرج التكراري لعرض تكرارات البيانات العددية المجمعة في فئات، وتكون الأعمدة متلاصقة عادةً."
},
{
unit:"الوحدة الثامنة: الدوال",
q:"إذا كانت د(س) = 2س - 3، فما قيمة د(4)؟",
o:["3","5","8","11"],
a:1,
e:"نعوّض س = 4: د(4) = 2 × 4 - 3 = 5."
}
];

const root=document.getElementById("questions");

questions.forEach((item,i)=>{
const box=document.createElement("section");
box.className="question";

const unit=document.createElement("div");
unit.className="unit";
unit.textContent=item.unit;
box.appendChild(unit);

const title=document.createElement("p");
title.textContent=(i+1)+". "+item.q;
box.appendChild(title);

item.o.forEach((option,j)=>{
const label=document.createElement("label");
const radio=document.createElement("input");
radio.type="radio";
radio.name="q"+i;
radio.value=j;
label.appendChild(radio);
label.appendChild(document.createTextNode(" "+option));
box.appendChild(label);
});

const feedback=document.createElement("div");
feedback.className="feedback";
feedback.hidden=true;
feedback.id="feedback"+i;
box.appendChild(feedback);
root.appendChild(box);
});

document.getElementById("quiz").addEventListener("submit",function(event){
event.preventDefault();
let score=0;
let answered=0;

questions.forEach((item,i)=>{
const selected=document.querySelector('input[name="q'+i+'"]:checked');
const feedback=document.getElementById("feedback"+i);
feedback.hidden=false;

if(selected){
answered++;
if(Number(selected.value)===item.a){
score++;
feedback.textContent="✅ إجابة صحيحة. "+item.e;
}else{
feedback.textContent="❌ الإجابة الصحيحة: "+item.o[item.a]+". "+item.e;
}
}else{
feedback.textContent="لم تجب عن السؤال. الإجابة الصحيحة: "+item.o[item.a]+". "+item.e;
}
});

document.getElementById("result").textContent=
"نتيجتك: "+score+" من "+questions.length+
" — أجبت عن "+answered+" من 10 أسئلة.";

window.scrollTo({top:0,behavior:"smooth"});
});
</script>
</body>
</html>
